name: 每日更新資料

on:
  schedule:
    # 週一到週五 23:40 UTC（夏令時間美東 19:40，冬令 18:40），財政部曲線通常傍晚公布
    - cron: "40 23 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "補齊歷史資料（第一次跑勾這個）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 驗證算法
        run: |
          python scripts/test_fedpricing.py
          python scripts/test_calendars.py
          python scripts/test_surprise.py
      - name: 抓資料
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch.py ${{ inputs.backfill && '--backfill' || '' }}
      - name: Commit
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
