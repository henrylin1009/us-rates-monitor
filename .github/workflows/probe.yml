name: probe
on:
  push:
    branches: [claude/desk-gaps]
    paths: [probe/probe.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python probe/probe.py
      - run: |
          git config user.name rates-bot; git config user.email rates-bot@users.noreply.github.com
          git add probe/out.json; git commit -m "probe output"; git push
