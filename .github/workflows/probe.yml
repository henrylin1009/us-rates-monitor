name: probe
on:
  push:
    branches: [probe-sr3]
    paths: [probe/probe.py]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python probe/probe.py
      - run: |
          git config user.name rates-bot; git config user.email rates-bot@users.noreply.github.com
          git add probe/result.json && git commit -m "probe result" && git push
