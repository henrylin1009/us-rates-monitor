name: probe
on:
  push:
    branches: [probe-pce]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python probe/probe.py
      - run: |
          git config user.name rates-bot; git config user.email rates-bot@users.noreply.github.com
          git add probe/out.txt; git commit -m "probe out"; git push
